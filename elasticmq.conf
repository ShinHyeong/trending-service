include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  post-view-queue {
      defaultVisibilityTimeout = 30 seconds
      delay = 0 seconds
      receiveMessageWait = 20 seconds
      deadLettersQueue {
        name = "post-view-dlq"
        maxReceiveCount = 3
      }
    }
    post-view-dlq {
      defaultVisibilityTimeout = 30 seconds
    }

    post-like-queue {
      defaultVisibilityTimeout = 30 seconds
      delay = 0 seconds
      receiveMessageWait = 20 seconds
      deadLettersQueue {
        name = "post-like-dlq"
        maxReceiveCount = 3
      }
    }
    post-like-dlq {
      defaultVisibilityTimeout = 30 seconds
    }
}