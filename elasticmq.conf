include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
}

queues {
  task-queue {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds # Long Polling 설정
    deadLettersQueue {
      name = "task-dlq"
      maxReceiveCount = 3
    }
  }
  task-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}